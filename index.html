<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f0e7" />
    <title>萌粒工坊 · IP Sticker Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <header class="topbar">
      <a class="brand" href="#top"><span class="brand-mark">●</span><span>萌粒工坊</span><em>IP STICKER STUDIO</em></a>
      <div class="status"><i></i> Volcengine Ark ready</div>
    </header>

    <main id="top">
      <section class="intro"><p class="eyebrow">IP STICKER STUDIO / 01</p><h1>把你，变成一套会说话的贴纸。</h1><p>上传一张照片，选一个情绪主题；剩下的交给萌粒工坊。</p></section>
      <section class="workspace" aria-label="贴纸生成工作台">
        <label class="upload-card" id="dropzone"><input id="file-input" type="file" accept="image/*" capture="environment" /><div id="upload-empty"><div class="upload-icon">↥</div><b>添加角色照片</b><span>相册 / 相机 · 建议正脸或全身</span></div><img id="preview" alt="已上传的角色预览" hidden /><span class="replace">更换照片</span></label>
        <div class="controls"><div class="control-heading"><span>01</span><div><b>今天，想怎么表达？</b><small>角色外观会在每张贴纸里保持一致</small></div></div><div class="modes"><button class="mode active" data-theme="日常聊天"><span>☻</span><b>日常聊天</b></button><button class="mode" data-theme="工作求生"><span>⌁</span><b>工作求生</b></button><button class="mode" data-theme="自定义主题"><span>✎</span><b>自定义</b></button></div><input id="theme-input" type="text" aria-label="自定义贴纸主题" placeholder="可选：例如我的猫猫日常、旅行打卡……" /><button id="generate-btn" class="generate">生成我的贴纸 <span>↗</span></button><div id="message" class="message" role="status" aria-live="polite">上传一张照片后即可开始。</div></div>
      </section>

      <section class="gallery-section"><div class="section-head"><div><p class="eyebrow">THE REACTION SHELF / 02</p><h2>你的情绪，值得<br /><i>被好好画下来。</i></h2></div><span class="count">12 / PACK</span></div><div id="gallery" class="gallery"><div class="gallery-placeholder"><span>✦</span><p>生成后，你的第一套表情会在这里出现。</p></div></div></section>
    </main>
    <footer><span>萌粒工坊 · 一张照片，一套专属表情。</span><span>图片仅用于本次生成。</span></footer>
    <script src="app.js"></script>
  </body>
</html>
